<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数拟合器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <h1>函数拟合器</h1>
                <p>调整函数与网络参数，观察神经网络学习拟合</p>
            </div>

            <div class="section">
                <h2>目标函数</h2>
                <div class="control-row">
                    <label>类型</label>
                    <select id="function-type"></select>
                </div>
                <div id="params-container"></div>
                <div class="formula" id="formula">y = x²</div>
            </div>

            <div class="section">
                <h2>网络参数</h2>
                <div class="control-row">
                    <label>隐藏层大小 <span id="hidden-val">16</span></label>
                    <input type="range" id="hidden-size" min="8" max="128" step="8" value="16">
                </div>
                <div class="control-row">
                    <label>隐藏层数量 <span id="layers-val">2</span></label>
                    <input type="range" id="hidden-layers" min="1" max="3" step="1" value="2">
                </div>
                <div class="control-row">
                    <label>激活函数</label>
                    <select id="activation">
                        <option value="tanh">Tanh</option>
                        <option value="relu">ReLU</option>
                        <option value="leaky_relu">Leaky ReLU</option>
                        <option value="sigmoid">Sigmoid</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>学习率 <span id="lr-val">0.02</span></label>
                    <input type="range" id="learning-rate" min="0.001" max="0.2" step="0.001" value="0.02">
                </div>
                <div class="control-row">
                    <label>训练轮数 <span id="epochs-val">300</span></label>
                    <input type="range" id="epochs" min="100" max="3000" step="100" value="300">
                </div>
            </div>

            <div class="actions">
                <button id="train-btn" class="btn primary">开始训练</button>
                <button id="reset-btn" class="btn">重置</button>
            </div>

            <div class="metrics">
                <div><span>Epoch</span><b id="epoch-display">0</b> / <span id="epoch-total">300</span></div>
                <div><span>Loss</span><b id="loss-display">—</b></div>
            </div>

            <div class="network-diag">
                <div class="layer">1</div>
                <div class="arrow"></div>
                <div class="layer" id="diag-h1">16</div>
                <div class="arrow" id="diag-arrow2"></div>
                <div class="layer" id="diag-h2">16</div>
                <div class="arrow" id="diag-arrow3"></div>
                <div class="layer" id="diag-h3">16</div>
                <div class="arrow" id="diag-arrow4"></div>
                <div class="layer">1</div>
            </div>
        </aside>

        <main class="preview">
            <div class="plot-wrap">
                <canvas id="fit-canvas" width="900" height="380"></canvas>
                <div class="legend">
                    <span class="target">目标函数</span>
                    <span class="pred">网络预测</span>
                    <span class="points">训练样本</span>
                </div>
            </div>
            <div class="plot-wrap small">
                <canvas id="loss-canvas" width="900" height="150"></canvas>
            </div>
        </main>
    </div>

    <button id="theme-toggle" class="theme-btn" title="切换日间/夜间模式" aria-label="切换日间/夜间模式">
        <svg viewBox="0 0 24 24" width="22" height="22">
            <g class="sun-icon">
                <circle cx="12" cy="12" r="4.5" />
                <g class="rays">
                    <line x1="12" y1="2" x2="12" y2="5" />
                    <line x1="12" y1="19" x2="12" y2="22" />
                    <line x1="4.93" y1="4.93" x2="7.05" y2="7.05" />
                    <line x1="16.95" y1="16.95" x2="19.07" y2="19.07" />
                    <line x1="2" y1="12" x2="5" y2="12" />
                    <line x1="19" y1="12" x2="22" y2="12" />
                    <line x1="4.93" y1="19.07" x2="7.05" y2="16.95" />
                    <line x1="16.95" y1="7.05" x2="19.07" y2="4.93" />
                </g>
            </g>
            <path class="moon-icon" d="M12 6.5a5.5 5.5 0 1 0 4.5 9.7 6.5 6.5 0 1 1-4.5-9.7z" />
        </svg>
    </button>

    <script src="app.js"></script>
</body>
</html>
